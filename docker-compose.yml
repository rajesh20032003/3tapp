version: "3"

services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: rajesh00007/backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    image: rajesh00007/frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
