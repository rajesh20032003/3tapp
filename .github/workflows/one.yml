name: app pipeline

on:
  push:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: testing linting frontend
        run: npm run lint
        working-directory: frontend

      - name: testing linting backend
        run: npm run lint
        working-directory: backend

      # Enable Docker buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build frontend image
      - name: Build frontend image
        run: docker build -t rajesh00007/frontend:latest ./frontend

      # Build backend image
      - name: Build backend image
        run: docker build -t rajesh00007/backend:latest ./backend

      # Push images
      - name: Push frontend
        run: docker push rajesh00007/frontend:latest

      - name: Push backend
        run: docker push rajesh00007/backend:latest
